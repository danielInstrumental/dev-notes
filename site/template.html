<meta charset="utf-8">
<title>Dev Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<!-- Page design + behavior. Content is NOT written here: build.mjs fills the DATA line in the script from the markdown. -->
<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --ink: #171a21;
    --muted: #586070;
    --faint: #878e9d;
    --line: #dcdfe6;
    --accent: #3244b5;
    --accent-soft: #e7eaf8;
    --house: #93560b;
    --house-soft: #f6ebdc;
    --mark: #ffe28a;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --sans: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1117; --surface: #171a22; --ink: #e6e8ee; --muted: #a2a9b7; --faint: #6e7585;
      --line: #292d38; --accent: #9ba9ff; --accent-soft: #1d2240; --house: #e2a757;
      --house-soft: #2d2317; --mark: #5e4f10;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1117; --surface: #171a22; --ink: #e6e8ee; --muted: #a2a9b7; --faint: #6e7585;
    --line: #292d38; --accent: #9ba9ff; --accent-soft: #1d2240; --house: #e2a757;
    --house-soft: #2d2317; --mark: #5e4f10;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding-inline: 1px; }
  .chev { width: .45rem; height: .45rem; border: solid currentColor; border-width: 0 1.5px 1.5px 0; rotate: -45deg; translate: 0 -1px; transition: rotate .15s; flex: none; }

  /* ── shell: sidebar + main ── */
  .shell {
    display: grid; grid-template-columns: 16.5rem minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 4rem);
    max-width: 78rem; margin-inline: auto; padding-inline: clamp(16px, 3vw, 40px);
  }
  .side {
    position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
    height: 100vh; overflow-y: auto; padding-block: 1.75rem 1.5rem;
    display: flex; flex-direction: column; gap: 1.25rem;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .brand a { font: 700 1.2rem/1 var(--display); color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
  .menu { display: none; }
  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: .93rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    padding: .55rem .75rem .55rem 2.1rem;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .search svg { position: absolute; left: .7rem; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--faint); }
  .search kbd {
    position: absolute; right: .6rem; top: 50%; translate: 0 -50%;
    font: 500 .72rem/1 var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: .2rem .35rem;
  }

  .nav { display: flex; flex-direction: column; gap: .1rem; }
  .nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .nav a, .nav .soon {
    display: flex; justify-content: space-between; gap: .5rem;
    padding: .28rem .55rem; margin-inline: -.55rem; border-radius: 5px;
    color: var(--muted); text-decoration: none; font-size: .88rem;
  }
  .nav a:hover { color: var(--ink); background: var(--surface); }
  .nav a[aria-current="true"] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .nav .n { font: 400 .75rem/1.9 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav .ch { display: flex; gap: .5rem; min-width: 0; }
  .nav .ch-num { font: 400 .75rem/1.9 var(--mono); color: var(--faint); min-width: 1.1rem; font-variant-numeric: tabular-nums; }
  .nav a.is-empty .ch-title { color: var(--faint); }
  .nav .soon { color: var(--faint); cursor: default; }
  .nav .contents { font-weight: 600; color: var(--ink); font-size: .92rem; margin-bottom: .35rem; }
  .nav-label {
    margin: .9rem 0 .3rem; font: 600 .68rem/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--faint);
  }
  .group-head {
    display: flex; align-items: center; gap: .55rem; width: calc(100% + 1.1rem); margin-inline: -.55rem;
    padding: .42rem .55rem; border: 0; border-radius: 5px; background: none; cursor: pointer;
    font: 600 .9rem/1.3 var(--sans); color: var(--ink); text-align: left;
  }
  .group-head:hover { background: var(--surface); }
  .group-head .chev { color: var(--faint); }
  .group-head[aria-expanded="true"] .chev { rotate: 45deg; translate: 0 -3px; }
  .group-head .part-num { font: 500 .72rem/1 var(--mono); color: var(--faint); min-width: 1.4rem; }
  .group-head .n { margin-left: auto; }
  .nav .group-body { padding: .1rem 0 .6rem 1rem; }   /* .nav-scoped: .nav ul would otherwise zero it */
  .built { margin-top: auto; font: 400 .72rem/1.5 var(--mono); color: var(--faint); }

  /* ── main column ── */
  main { padding-block: 2.5rem 6rem; max-width: 50rem; min-width: 0; }
  .view-head { margin-bottom: 2rem; }
  .eyebrow { margin: 0 0 .5rem; font: 600 .72rem/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
  h1 { margin: 0 0 .75rem; font: 700 clamp(2rem, 4.5vw, 2.7rem)/1.05 var(--display); letter-spacing: -.025em; text-wrap: balance; }
  .lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 1.02rem; }
  .meta { margin: .9rem 0 0; font: 400 .8rem/1.5 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .legend { margin: 1rem 0 0; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; color: var(--muted); font-size: .88rem; }
  .block-head {
    display: flex; align-items: baseline; gap: .75rem; margin: 2.75rem -.6rem 0; padding: 0 .6rem .55rem;
    border-bottom: 2px solid var(--ink);
  }
  .block-head h2 { margin: 0; font: 700 1.35rem/1.2 var(--display); letter-spacing: -.015em; }
  .block-head .count { margin-left: auto; font: 400 .78rem/1 var(--mono); color: var(--faint); }

  /* ── contents: parts → chapters ── */
  .toc-row {
    display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .1rem 1rem; align-items: baseline;
    padding: .85rem .6rem; margin-inline: -.6rem; border-bottom: 1px solid var(--line);
    text-decoration: none; color: var(--ink); border-radius: 4px;
  }
  .toc-row:hover { background: var(--surface); }
  .toc-num { font: 500 .85rem/1.5 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .toc-title { font: 700 1.05rem/1.35 var(--display); }
  .toc-covers { grid-column: 2; color: var(--muted); font-size: .9rem; }
  .toc-count { grid-row: 1; grid-column: 3; font: 400 .78rem/1.5 var(--mono); color: var(--faint); white-space: nowrap; }
  .toc-row.is-empty .toc-title { color: var(--muted); }
  .empty-tag {
    font: 600 .62rem/1 var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
    border: 1px dashed var(--line); border-radius: 3px; padding: .25rem .35rem .2rem;
  }

  /* ── terms ── */
  .term {
    display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: .2rem 1.5rem;
    padding: .85rem .6rem; margin-inline: -.6rem; border-bottom: 1px solid var(--line);
    scroll-margin-top: 1.5rem; border-radius: 4px;
  }
  .term:target { animation: flash 2.4s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .term-name {
    margin: 0; font: 500 .92rem/1.55 var(--mono); color: var(--ink); overflow-wrap: anywhere;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .45rem;
  }
  .term-body { min-width: 0; }
  .term-body > p { margin: 0; }
  .xlat { color: var(--house); }
  .xlat + .def { margin-top: .2rem; }
  .crumb { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .35rem; margin-bottom: .15rem; font: 400 .76rem/1.5 var(--sans); color: var(--faint); text-decoration: none; }
  a.crumb:hover { color: var(--accent); }
  .crumb-part { font-family: var(--mono); font-size: .72rem; }
  .house {
    font: 600 .62rem/1 var(--sans); text-transform: uppercase; letter-spacing: .08em;
    color: var(--house); background: var(--house-soft); border-radius: 3px; padding: .25rem .35rem .2rem;
    translate: 0 -1px;
  }
  .deep-link {
    margin-top: .4rem; display: inline-flex; align-items: baseline; gap: .4rem; flex-wrap: wrap;
    font: 500 .84rem/1.4 var(--sans); text-decoration: none;
  }
  .deep-link:hover .deep-word { text-decoration: underline; }
  .deep-link .where { color: var(--faint); font-weight: 400; }
  .deep-link + .deep-link { margin-left: 1rem; }
  .empty-note { margin: 1.1rem 0 0; color: var(--muted); max-width: 62ch; }

  /* ── explanations (rendered markdown) ── */
  .dd-section { margin-top: 2.25rem; scroll-margin-top: 1.5rem; }
  .dd-section h3 { margin: 0 0 .6rem; font: 700 1.2rem/1.25 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .dd-section:target h3 { color: var(--accent); }
  .prose { max-width: 68ch; }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose blockquote { margin-block: .7rem; }
  .prose ul, .prose ol { padding-left: 1.2rem; }
  .prose li { margin-block: .3rem; }
  .prose li::marker { color: var(--faint); }
  .prose strong { font-weight: 600; }
  .prose code {
    font: 400 .86em/1 var(--mono); background: var(--accent-soft); color: var(--ink);
    border-radius: 3px; padding: .12em .32em;
  }
  .prose pre {
    overflow-x: auto; margin-block: 1rem; padding: .85rem 1rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 7px; font: 400 .8rem/1.55 var(--mono);
  }
  .prose pre code { background: none; padding: 0; font-size: inherit; line-height: inherit; }
  .prose blockquote { margin-inline: 0; padding: .6rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .prose blockquote p { margin: 0; }
  .prose table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .9rem; margin-block: 1rem; max-width: 100%; }
  .prose th, .prose td { text-align: left; vertical-align: top; padding: .5rem .8rem .5rem 0; border-bottom: 1px solid var(--line); }
  .prose th { font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }

  /* ── inbox ── */
  .note-meta { margin: 1rem 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
  .tag { font: 500 .74rem/1 var(--mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .3rem .45rem; }
  .status { font: 600 .66rem/1 var(--sans); text-transform: uppercase; letter-spacing: .08em; border-radius: 3px; padding: .3rem .4rem .25rem; color: var(--accent); background: var(--accent-soft); }
  .status.is-done { color: var(--faint); background: none; border: 1px dashed var(--line); }
  .nav .note-date { font: 400 .72rem/1.9 var(--mono); color: var(--faint); white-space: nowrap; }
  .nav .note-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── page turn ── */
  .page-turn { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4rem; }
  .page-turn a {
    display: flex; flex-direction: column; gap: .15rem; padding: .85rem 1rem; text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--surface);
  }
  .page-turn a:hover { border-color: var(--accent); }
  .page-turn .dir { font: 500 .72rem/1.2 var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
  .page-turn .next { grid-column: 2; text-align: right; }

  /* ── search results ── */
  .results .block-head h2 { font-size: 1.1rem; }
  .hit { display: block; padding: .8rem .6rem; margin-inline: -.6rem; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); border-radius: 4px; }
  .hit:hover { background: var(--surface); }
  .hit-where { display: block; font-weight: 600; color: var(--accent); font-size: .92rem; }
  .hit-snip { display: block; color: var(--muted); font-size: .9rem; margin-top: .15rem; }
  .empty { color: var(--muted); }

  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .side { position: static; height: auto; padding-block: 1rem .5rem; gap: .85rem; border-bottom: 1px solid var(--line); }
    .menu {
      display: inline-flex; font: 500 .85rem/1 var(--sans); color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: 6px; padding: .45rem .7rem; cursor: pointer;
    }
    .search kbd, .built { display: none; }
    .nav { display: none; padding-bottom: .5rem; }
    .nav-open .nav { display: flex; }
    main { padding-block: 1.75rem 4rem; }
  }
  @media (max-width: 560px) {
    .term { grid-template-columns: minmax(0, 1fr); }
    .toc-row { grid-template-columns: 1.6rem minmax(0, 1fr); }
    .toc-count { grid-row: auto; grid-column: 2; }
    .page-turn { grid-template-columns: minmax(0, 1fr); }
    .page-turn .next { grid-column: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .term:target { animation: none; background: var(--accent-soft); }
    .chev { transition: none; }
  }
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <a href="#concepts">dev-notes</a>
      <button class="menu" type="button" id="menu" aria-expanded="false" aria-controls="nav">Browse</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search concepts and notes" autocomplete="off" spellcheck="false" aria-label="Search terms and explanations">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <p class="built" id="built"></p>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = __DATA__;

const $ = (sel) => document.querySelector(sel);
const main = $('#main');
const q = $('#q');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

const chapterById = Object.fromEntries(DATA.chapters.map((c) => [c.id, c]));
const partByNum = Object.fromEntries(DATA.parts.map((p) => [p.num, p]));
const allTerms = DATA.chapters.flatMap((c) => c.terms.map((t) => ({ ...t, chapter: c })));
const chapterOfTerm = Object.fromEntries(allTerms.map((t) => [t.id, t.chapter.id]));
const noteById = Object.fromEntries(DATA.notes.map((n) => [n.id, n]));
const partTerms = (p) => p.chapters.reduce((n, id) => n + chapterById[id].terms.length, 0);

// ── sidebar: the book's contents, one accordion per part ──
const SOON = ['Bug classes', 'Skills kit', 'Snippets', 'Lessons'];
const group = (id, head, count, items) => `
  <section class="group" data-group="${id}">
    <button class="group-head" type="button" aria-expanded="false" aria-controls="g-${id}">
      <span class="chev" aria-hidden="true"></span>${head}<span class="n">${count}</span>
    </button>
    <ul class="group-body" id="g-${id}" hidden>${items}</ul>
  </section>`;
$('#nav').innerHTML =
  `<a class="contents" href="#concepts" data-view="concepts"><span>Contents</span><span class="n">${allTerms.length}</span></a>` +
  `<p class="nav-label">Concepts</p>` +
  DATA.parts.map((p) => group(`part-${p.num}`, `<span class="part-num">${p.num}</span>${esc(p.name)}`, partTerms(p),
    p.chapters.map((id) => {
      const c = chapterById[id];
      return `<li><a href="#${c.id}" data-view="${c.id}" class="${c.terms.length ? '' : 'is-empty'}">
        <span class="ch"><span class="ch-num">${c.num}</span><span class="ch-title">${esc(c.title)}</span></span>
        <span class="n">${c.terms.length || '–'}</span></a></li>`;
    }).join(''))).join('') +
  `<p class="nav-label">Inbox</p>` +
  group('inbox', 'Notes', DATA.notes.length, DATA.notes.map((n) => `<li><a href="#${n.id}" data-view="${n.id}" title="${esc(n.title)}">
      <span class="note-title">${esc(n.title)}</span><span class="note-date">${esc(n.date.slice(5))}</span></a></li>`).join('')) +
  `<p class="nav-label">Later</p>` +
  group('later', 'Coming later', SOON.length, SOON.map((name) => `<li class="soon"><span>${name}</span></li>`).join(''));
$('#built').innerHTML = `Built ${esc(DATA.built)} from ${esc(DATA.commit)}.<br>Edit the markdown in knowledge/ or inbox/, then rebuild.`;

// Accordion state: remembered in this browser (a convenience, so storage failing is fine).
// The part you're reading opens by itself; one you open or close by hand stays that way.
const NAV_KEY = 'dev-notes:nav-groups';
const navOpen = (() => { try { return JSON.parse(localStorage.getItem(NAV_KEY)) || {}; } catch { return {}; } })();
const saveNav = () => { try { localStorage.setItem(NAV_KEY, JSON.stringify(navOpen)); } catch {} };
function setGroup(id, open) {
  navOpen[id] = open;
  const head = document.querySelector(`[data-group="${id}"] .group-head`);
  head.setAttribute('aria-expanded', String(open));
  head.nextElementSibling.hidden = !open;
}
document.querySelectorAll('.group').forEach((g) => setGroup(g.dataset.group, Boolean(navOpen[g.dataset.group])));
let activeGroup = null;
function openGroupFor(v) {
  const c = chapterById[v];
  if (!c && !noteById[v]) return;   // the contents page belongs to no single group
  const id = c ? `part-${c.part}` : 'inbox';
  if (id === activeGroup) return;
  if (activeGroup) setGroup(activeGroup, false);
  setGroup(id, true);
  activeGroup = id;
  saveNav();
}
$('#nav').addEventListener('click', (e) => {
  const head = e.target.closest('.group-head');
  if (!head) return;
  setGroup(head.parentElement.dataset.group, head.getAttribute('aria-expanded') !== 'true');
  saveNav();
});

// "IV Changing it › 12 Delivery & version control"
const crumb = (c) => `<span class="crumb-part">${c.part} ${esc(partByNum[c.part].name)}</span><span aria-hidden="true">›</span><span>${c.num} ${esc(c.title)}</span>`;

// ── one term row ──
function termHTML(t, words) {
  const name = words ? highlight(t.name, words) : esc(t.name);
  const deep = t.deep.map((d) => `
    <a class="deep-link" href="#${d.anchor}"><span class="deep-word">Deep dive ↓</span><span class="where">${esc(d.label)}</span></a>`).join('');
  return `<article class="term" id="${t.id}">
    <h3 class="term-name"><span>${name}</span>${t.house ? '<span class="house" title="House term: coined in my projects">house</span>' : ''}</h3>
    <div class="term-body">
      ${words ? `<a class="crumb" href="#${t.id}" aria-label="Open in chapter ${t.chapter.num}, ${esc(t.chapter.title)}">${crumb(t.chapter)}</a>` : ''}
      ${t.translation ? `<p class="xlat">≈ ${t.translation}</p>` : ''}
      ${t.def ? `<p class="def">${t.def}</p>` : ''}
      ${deep}
    </div>
  </article>`;
}

// ── views ──
function renderContents() {
  const empty = DATA.chapters.filter((c) => !c.terms.length).length;
  const house = allTerms.filter((t) => t.house).length;
  main.innerHTML = `
    <header class="view-head">
      <p class="eyebrow">Knowledge</p>
      <h1>Concepts</h1>
      <p class="lede">The engineering vocabulary I work with, arranged the way a reference book would arrange it: ${DATA.parts.length} parts, one chapter per topic. Each term gets one line; where I've written a fuller explanation in my own words, it sits in the same chapter.</p>
      <p class="meta">${allTerms.length} terms · ${DATA.chapters.length} chapters · ${empty} still empty</p>
      <p class="legend"><span class="house">house</span> ${house} terms coined in my projects. Useful, but translate them (≈) when talking to other engineers.</p>
    </header>
    ${DATA.parts.map((p) => `
      <section>
        <header class="block-head"><h2>Part ${p.num} · ${esc(p.name)}</h2><span class="count">${plural(partTerms(p), 'term')}</span></header>
        ${p.chapters.map((id) => {
          const c = chapterById[id];
          return `<a class="toc-row ${c.terms.length ? '' : 'is-empty'}" href="#${c.id}">
            <span class="toc-num">${c.num}</span>
            <span class="toc-title">${esc(c.title)}</span>
            <span class="toc-count">${c.terms.length ? plural(c.terms.length, 'term') : '<span class="empty-tag">empty</span>'}</span>
            <span class="toc-covers">${c.covers}</span>
          </a>`;
        }).join('')}
      </section>`).join('')}`;
}

function renderChapter(c) {
  const i = DATA.chapters.indexOf(c);
  const prev = DATA.chapters[i - 1];
  const next = DATA.chapters[i + 1];
  main.innerHTML = `
    <header class="view-head">
      <p class="eyebrow">Part ${c.part} · ${esc(partByNum[c.part].name)} · Chapter ${c.num}</p>
      <h1>${esc(c.title)}</h1>
      <p class="lede">${c.covers}</p>
    </header>
    <section>
      <header class="block-head"><h2>Terms</h2><span class="count">${c.terms.length || 'none yet'}</span></header>
      ${c.terms.length ? c.terms.map((t) => termHTML({ ...t, chapter: c })).join('')
        : `<p class="empty-note">No terms yet. This chapter marks where a reference book would cover this topic, so new terms have a home when you meet them.</p>`}
    </section>
    ${c.sections.length ? `
      <section>
        <header class="block-head"><h2>Deep dives</h2><span class="count">${c.sections.length}</span></header>
        ${c.sections.map((s) => `<section class="dd-section" id="${s.id}"><h3>${s.heading}</h3><div class="prose">${s.html}</div></section>`).join('')}
      </section>` : ''}
    <nav class="page-turn" aria-label="Chapters">
      ${prev ? `<a class="prev" href="#${prev.id}"><span class="dir">← Chapter ${prev.num}</span>${esc(prev.title)}</a>` : ''}
      ${next ? `<a class="next" href="#${next.id}"><span class="dir">Chapter ${next.num} →</span>${esc(next.title)}</a>` : ''}
    </nav>`;
}

function renderNote(n) {
  const done = !/^active/i.test(n.status);
  main.innerHTML = `
    <header class="view-head">
      <p class="eyebrow">Inbox · ${esc(n.date)}</p>
      <h1>${esc(n.title)}</h1>
      <p class="note-meta"><span class="status ${done ? 'is-done' : ''}">${esc(n.status)}</span>${n.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</p>
    </header>
    ${n.intro ? `<div class="prose">${n.intro}</div>` : ''}
    ${n.sections.map((s) => `<section class="dd-section" id="${s.id}"><h3>${s.heading}</h3><div class="prose">${s.html}</div></section>`).join('')}`;
}

// ── search: every word must appear in a term's name/definition or an explanation's text ──
const sectionIndex = [
  ...DATA.chapters.flatMap((c) => c.sections.map((s) => ({ anchor: s.id, crumb: crumb(c), heading: s.plain, text: s.text }))),
  ...DATA.notes.flatMap((n) => n.sections.map((s) => ({ anchor: s.id, crumb: `<span class="crumb-part">Inbox</span><span aria-hidden="true">›</span><span>${esc(n.title)}</span>`, heading: s.plain, text: s.text }))),
];

function highlight(str, words) {
  const safe = esc(str);
  if (!words.length) return safe;
  return safe.replace(new RegExp(`(${words.map((w) => reEsc(esc(w))).join('|')})`, 'gi'), '<mark>$1</mark>');
}
function snippet(text, words) {
  const lower = text.toLowerCase();
  const at = Math.max(0, Math.min(...words.map((w) => lower.indexOf(w)).filter((i) => i >= 0)));
  const start = Math.max(0, at - 60);
  const cut = text.slice(start, at + 140);
  return (start ? '…' : '') + highlight(cut, words) + (at + 140 < text.length ? '…' : '');
}

function renderSearch(query) {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const has = (hay) => words.every((w) => hay.toLowerCase().includes(w));
  const terms = allTerms
    .filter((t) => has(`${t.name} ${t.text}`))
    .map((t) => ({ t, rank: t.name.toLowerCase().startsWith(words[0]) ? 0 : has(t.name) ? 1 : 2 }))
    .sort((a, b) => a.rank - b.rank)
    .map(({ t }) => t);
  const found = sectionIndex.filter((s) => has(`${s.heading} ${s.text}`));
  const summary = [terms.length && plural(terms.length, 'term'), found.length && plural(found.length, 'section')].filter(Boolean).join(' · ');
  main.innerHTML = `
    <header class="view-head">
      <p class="eyebrow">Search</p>
      <h1>${esc(query)}</h1>
      <p class="lede">${summary || 'No matches.'}</p>
    </header>
    <div class="results">
      ${!terms.length && !found.length ? `<p class="empty">Search looks at term names, their one-line definitions, the deep dives and the inbox. Try fewer words, or part of a word.</p>` : ''}
      ${terms.length ? `<header class="block-head"><h2>Terms</h2><span class="count">${terms.length}</span></header>${terms.map((t) => termHTML(t, words)).join('')}` : ''}
      ${found.length ? `<header class="block-head"><h2>In the deep dives and inbox</h2><span class="count">${found.length}</span></header>${found.map((s) => `
        <a class="hit" href="#${s.anchor}">
          <span class="crumb">${s.crumb}</span>
          <span class="hit-where">${highlight(s.heading, words)}</span>
          <span class="hit-snip">${snippet(s.text, words)}</span>
        </a>`).join('')}` : ''}
    </div>`;
  view = 'search';
  setCurrent(null);
}

// ── routing: the #hash picks the view — a chapter, or a term/explanation inside one ──
let view = null;
let first = true;
function route() {
  const hash = decodeURIComponent(location.hash.slice(1)) || 'concepts';
  const base = hash.split('--')[0];
  const chapter = chapterById[base] ?? chapterById[chapterOfTerm[hash]];
  const note = noteById[base];
  const next = chapter ? chapter.id : note ? note.id : 'concepts';
  if (next !== view) {
    if (chapter) renderChapter(chapter); else if (note) renderNote(note); else renderContents();
    view = next;
  }
  setCurrent(next);
  openGroupFor(next);
  const target = hash === next ? null : document.getElementById(hash);
  // after layout settles (and again once fonts load, which shifts it) so the target stays in view
  const scroll = () => target ? target.scrollIntoView({ block: 'start' }) : window.scrollTo(0, 0);
  requestAnimationFrame(scroll);
  if (first) { first = false; document.fonts?.ready.then(() => requestAnimationFrame(scroll)); }
  document.body.classList.remove('nav-open');
  $('#menu').setAttribute('aria-expanded', 'false');
}
function setCurrent(v) {
  document.querySelectorAll('.nav a').forEach((a) => a.setAttribute('aria-current', a.dataset.view === v ? 'true' : 'false'));
}

// ── events ──
document.addEventListener('click', (e) => {   // following a link out of search clears it
  const link = e.target.closest('a[href^="#"]');
  if (!link || !q.value) return;
  q.value = '';
  view = null;
  if (link.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
});
q.addEventListener('input', () => {
  if (q.value.trim()) renderSearch(q.value.trim());
  else { view = null; route(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q && q.value) { q.value = ''; view = null; route(); }
});
$('#menu').addEventListener('click', () => {
  const open = document.body.classList.toggle('nav-open');
  $('#menu').setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', route);
route();
</script>
